<!DOCTYPE html>
<html>
<head>
    <title>Online Payment Simulation</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 25px;
            width: 320px;
            border-radius: 8px;
            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .msg {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>💳 Payment Simulation</h2>

    <input type="number" id="userId" placeholder="User ID" value="1">
    <input type="number" id="merchantId" placeholder="Merchant ID" value="1">
    <input type="number" id="amount" placeholder="Amount">

    <button onclick="makePayment()">Pay Now</button>

    <div class="msg" id="message"></div>
</div>

<script>
function makePayment() {
    const userId = document.getElementById("userId").value;
    const merchantId = document.getElementById("merchantId").value;
    const amount = document.getElementById("amount").value;

    fetch("/pay", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            userId: userId,
            merchantId: merchantId,
            amount: amount
        })
    })
    .then(res => res.text())
    .then(data => {
        document.getElementById("message").innerText = data;
    })
    .catch(err => {
        document.getElementById("message").innerText = "Payment Error";
    });
}
</script>

</body>
</html>
