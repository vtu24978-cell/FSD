<!DOCTYPE html>
<html>
<head>
  <title>Audit Logging Dashboard</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; padding: 20px; }
    form { background: #fff; padding: 15px; margin-bottom: 20px; width: 300px; }
    input, button { width: 100%; padding: 8px; margin: 5px 0; }
    button { background: green; color: white; border: none; }
  </style>
</head>
<body>

<h2>Add Employee</h2>
<form action="/add" method="post">
  <input type="text" name="name" placeholder="Name" required>
  <input type="text" name="department" placeholder="Department" required>
  <input type="number" name="salary" placeholder="Salary" required>
  <button>Add</button>
</form>

<h2>Update Salary</h2>
<form action="/update" method="post">
  <input type="number" name="id" placeholder="Employee ID" required>
  <input type="number" name="salary" placeholder="New Salary" required>
  <button>Update</button>
</form>

<h2>View Audit Report</h2>
<button onclick="loadReport()">Load Report</button>
<pre id="output"></pre>

<script>
function loadReport() {
  fetch('/report')
    .then(res => res.json())
    .then(data => {
      document.getElementById("output").textContent =
        JSON.stringify(data, null, 2);
    });
}
</script>

</body>
</html>
