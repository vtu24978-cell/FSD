<!DOCTYPE html>
<html>
<head>
    <title>Order Management</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #aaa; padding: 8px; text-align: center; }
        th { background: #f2f2f2; }
        .box { background: #e6f2ff; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>

<h2>🛒 Customer Order History</h2>
<table>
    <thead>
        <tr>
            <th>Customer</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody id="orders"></tbody>
</table>

<div class="box" id="highest"></div>
<div class="box" id="active"></div>

<script>
fetch("/orders").then(res=>res.json()).then(data=>{
    let rows="";
    data.forEach(o=>{
        rows+=`<tr>
            <td>${o.name}</td>
            <td>${o.product_name}</td>
            <td>${o.quantity}</td>
            <td>${o.price}</td>
            <td>${o.total}</td>
            <td>${o.order_date}</td>
        </tr>`;
    });
    document.getElementById("orders").innerHTML=rows;
});

fetch("/highest").then(res=>res.json()).then(d=>{
    document.getElementById("highest").innerHTML =
        "💰 Highest Value Order: " + d.name + " - ₹" + d.total;
});

fetch("/active").then(res=>res.json()).then(d=>{
    document.getElementById("active").innerHTML =
        "🔥 Most Active Customer: " + d.name;
});
</script>

</body>
</html>
